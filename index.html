<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Slime Chronicles</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      #loading-screen {
        position: fixed;
        inset: 0;
        background: #000;
        color: #fff;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        transition: opacity 0.5s;
      }
      #loading-bar-container {
        width: 300px;
        height: 10px;
        background: #333;
        margin-top: 20px;
        border-radius: 5px;
        overflow: hidden;
        border: 1px solid #555;
      }
      #loading-bar {
        width: 0%;
        height: 100%;
        background: #00ff00;
        transition: width 0.1s linear;
        box-shadow: 0 0 10px #00ff00;
      }
      .hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <h1>CHARGEMENT...</h1>
      <div id="loading-bar-container">
        <div id="loading-bar"></div>
      </div>
      <p id="loading-details" style="margin-top: 10px; color: #888; font-size: 12px">
        Initialisation...
      </p>
    </div>

    <div id="game-container"></div>
    <div id="system-overlays"></div>
    <div id="ui-layer">
      <div id="menu-main"></div>
      <div id="menu-classes"></div>
      <div id="menu-compendium"></div>
      <div id="game-hud"></div>
      <div id="game-talents"></div>
      <div id="game-modals"></div>
      <div id="menu-forge"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
