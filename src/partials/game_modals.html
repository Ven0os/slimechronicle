<div id="prismatic-modal" class="original-screen">
    <h1 style="font-size: 2.5rem; color: #ff00ff; text-shadow: 0 0 20px #ff00ff;">CHOIX PRISMATIQUE</h1>
    <p style="color:white;">Le temps s'est arrêté. Choisissez votre destin.</p>
    <div class="prism-options" id="prism-container"></div>
</div>

<div id="safe-hub-panel" class="safe-hub-panel pointer-events-auto">
    <div class="safe-hub-card">
        <div class="safe-hub-ornament safe-hub-ornament-tl"></div>
        <div class="safe-hub-ornament safe-hub-ornament-br"></div>
        <div class="safe-hub-icon"><i class="fas fa-store"></i></div>
        <h2>Marchand de la Base</h2>
        <p>Services disponibles uniquement dans la zone sûre.</p>
        <div class="safe-hub-actions">
            <button type="button" class="btn-main safe-hub-btn safe-hub-btn--stellar" data-hub-action="stellar">
                <i class="fas fa-book"></i>
                <span>Menu</span>
            </button>
            <button type="button" class="btn-main safe-hub-btn safe-hub-btn--forge" data-hub-action="forge">
                <i class="fas fa-hammer"></i>
                <span>Fusion prismatique</span>
            </button>
        </div>
        <button type="button" class="btn-secondary safe-hub-close" data-hub-action="close">Fermer</button>
    </div>
</div>

<div id="death-screen" class="original-screen" style="display: none;">
    <h1 style="color: var(--danger);">VOUS ÊTES MORT</h1>
    <p style="color:white;" id="death-msg">Respawn dans la Safe Zone...</p>
    <div id="spectate-msg" style="display:none; color:var(--gold); margin-top:10px;">MODE SPECTATEUR</div>
    <button id="btn-respawn" class="btn-main" style="margin-top:20px; pointer-events:auto;"
        onclick="if(Globals.player) Globals.player.respawn()">RESSUSCITER</button>
</div>

<!-- ESC / PAUSE MENU -->
<div id="pause-menu" class="original-screen" style="display: none; justify-content: center; align-items: center; z-index: 1000; position: fixed; inset: 0; background: rgba(2, 2, 5, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); pointer-events: auto;">
    <div style="width: 100%; max-width: 400px; padding: 40px; background: rgba(10, 10, 15, 0.75); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.15); display: flex; flex-direction: column; align-items: center; gap: 24px; position: relative;">
        <!-- Top border glow -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #d4af37, transparent); border-radius: 16px 16px 0 0;"></div>
        
        <h1 style="font-family: 'Cinzel', serif; font-size: 2.2rem; font-weight: 700; color: #d4af37; text-shadow: 0 0 15px rgba(212, 175, 55, 0.4); text-transform: uppercase; letter-spacing: 4px; margin: 0; text-align: center;">Expédition en Pause</h1>
        
        <div class="btn-group" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
            <button class="btn-main" onclick="UI.togglePauseMenu()" style="width: 100%; text-transform: uppercase; letter-spacing: 1.5px;">Reprendre</button>
            <button class="btn-main" onclick="UI.openInGameOptions()" style="width: 100%; text-transform: uppercase; letter-spacing: 1.5px;">Options</button>
            <button class="btn-secondary" onclick="UI.quitToMainMenu()" style="width: 100%; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 10px;">Abandonner</button>
        </div>
    </div>
</div>
