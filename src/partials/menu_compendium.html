<!-- INDEX PRISMATIQUE -->
<div id="screen-compendium" class="menu-screen">
    <div class="prism-index-page">
        <header class="prism-index-hero">
            <div class="prism-index-hero-inner">
                <div class="prism-index-brand">
                    <div class="prism-index-icon-wrap" aria-hidden="true">
                        <i class="fas fa-gem"></i>
                    </div>
                    <div class="prism-index-titles">
                        <h2 class="prism-index-title">Index Prismatic</h2>
                        <p class="prism-index-subtitle">Catalogue des fragments &amp; enchantements</p>
                    </div>
                </div>
                <div class="prism-index-stats" id="prism-index-stats">
                    <div class="prism-stat-pill"><strong id="prism-stat-total">—</strong><span>Total</span></div>
                    <div class="prism-stat-pill acquired"><strong id="prism-stat-owned">—</strong><span>Acquis</span></div>
                    <div class="prism-stat-pill favorites"><strong id="prism-stat-fav">—</strong><span>Favoris</span></div>
                </div>
            </div>
            <div class="prism-index-hero-line" aria-hidden="true"></div>
        </header>

        <main class="prism-index-body">
            <div class="prism-index-toolbar compendium-header" id="compendium-toolbar"></div>
            <div id="compendium-grid" class="compendium-grid"></div>
        </main>

        <footer class="prism-index-footer">
            <div class="btn-group prism-index-back">
                <button class="btn-main" type="button" onclick="UI.backToLanding()">Retour à l'accueil</button>
            </div>
        </footer>
    </div>
</div>
