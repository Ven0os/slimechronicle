<!-- ÉCRAN D'ACCUEIL -->
<div id="screen-landing" class="menu-screen active">
    <h1 class="menu-title">SLIME CHRONICLES</h1>
    <h2 class="menu-subtitle">R E F O R G E D</h2>
    <div class="btn-group">
        <button class="btn-main" onclick="UI.goToModeSelect()">JOUER</button>
        <button class="btn-main" onclick="UI.goToCompendium()">INDEX PRISMATIQUE</button>
        <div style="text-align:center; font-size:10px; color:#555; margin-top:10px;">Build v4.3.3 - UI Update</div>
    </div>
</div>

<!-- SÉLECTION DU MODE -->
<div id="screen-mode" class="menu-screen">
    <h1 class="menu-title">MODE DE JEU</h1>
    <div class="btn-group">
        <button class="btn-main" onclick="Network.startSolo()">AVENTURE SOLO</button>
        <button class="btn-main" onclick="UI.goToLobbyHost()">CRÉER (HOST)</button>
        <button class="btn-main" onclick="UI.goToLobbyJoin()">REJOINDRE (CLIENT)</button>
        <button class="btn-secondary" onclick="UI.backToLanding()">RETOUR</button>
    </div>
</div>

<!-- LOBBY HÔTE -->
<div id="screen-host" class="menu-screen">
    <h1 class="menu-title">SALLE D'ATTENTE</h1>
    <div class="status-panel">
        <h3 style="color:var(--menu-gold)">VOTRE CODE DE PARTIE</h3>
        <div id="host-code-display" class="input-code"
            style="border:none; background:transparent; font-size: 3rem; color: #fff;">...</div>
        <div style="color:#aaa; margin-bottom: 20px;">Donnez ce code à votre ami.</div>
        <div class="loader" id="host-loader"></div>
        <div id="host-status">En attente d'un joueur...</div>
        <button class="btn-main" style="margin-top:20px;" onclick="location.reload()">ANNULER</button>
    </div>
</div>

<!-- LOBBY REJOINDRE -->
<div id="screen-join" class="menu-screen">
    <h1 class="menu-title">REJOINDRE</h1>
    <div class="status-panel">
        <h3 style="color:var(--menu-gold)">ENTREZ LE CODE</h3>
        <input type="text" id="join-code-input" class="input-code" placeholder="EX: A1B2" maxlength="5">
        <button class="btn-main" onclick="Network.joinGame()">CONNEXION</button>
        <button class="btn-secondary" style="margin-top:10px;" onclick="UI.goToModeSelect()">RETOUR</button>
        <div id="join-status" style="margin-top:10px; color: var(--danger);"></div>
    </div>
</div>

<!-- ÉCRAN CONFIGURATION OPTIONS -->
<div id="screen-options" class="menu-screen options-screen">
    <div class="options-container">
        <header class="options-title-wrap">
            <h1>OPTIONS DE JEU</h1>
        </header>

        <!-- Presets Section -->
        <div class="presets-section">
            <span class="presets-title">Difficulté de l'Expédition</span>
            <div class="difficulty-presets">
                <button class="btn-preset" id="preset-exploration" onclick="UI.applyPreset('exploration')">
                    <span class="preset-tier">TIER I</span>
                    <span class="preset-name">Recrue</span>
                </button>
                <button class="btn-preset" id="preset-survivant" onclick="UI.applyPreset('survivant')">
                    <span class="preset-tier">TIER II</span>
                    <span class="preset-name">Survivant</span>
                </button>
                <button class="btn-preset" id="preset-champion" onclick="UI.applyPreset('champion')">
                    <span class="preset-tier">TIER III</span>
                    <span class="preset-name">Champion</span>
                </button>
                <button class="btn-preset" id="preset-cauchemar" onclick="UI.applyPreset('cauchemar')">
                    <span class="preset-tier">TIER IV</span>
                    <span class="preset-name">Cauchemar</span>
                </button>
            </div>
        </div>

        <!-- Onglets / Catégories -->
        <div class="options-tabs">
            <button class="tab-btn active" onclick="UI.switchOptionsTab('enemies', this)">
                <i class="fas fa-ghost"></i> Ennemis
            </button>
            <button class="tab-btn" onclick="UI.switchOptionsTab('player', this)">
                <i class="fas fa-shield-halved"></i> Joueur
            </button>
            <button class="tab-btn" onclick="UI.switchOptionsTab('loot', this)">
                <i class="fas fa-gem"></i> Destin
            </button>
        </div>
        
        <main class="options-scroll-area">
            <!-- TAB ENEMIES -->
            <div id="tab-content-enemies" class="tab-content active">
                <!-- PV des Ennemis -->
                <div class="option-row-card">
                    <div class="option-header">
                        <div class="option-label-wrap">
                            <i class="fas fa-heart-crack icon-hp"></i>
                            <label for="opt-hp">PV des Ennemis</label>
                        </div>
                        <span id="opt-val-hp" class="option-value-badge">1.0</span>
                    </div>
                    <input type="range" id="opt-hp" class="option-slider" min="0.5" max="10.0" step="0.5" value="1.0" oninput="document.getElementById('opt-val-hp').innerText = parseFloat(this.value).toFixed(1) + 'x'; UI.onSliderChange()">
                </div>

                <!-- Dégâts des Ennemis -->
                <div class="option-row-card">
                    <div class="option-header">
                        <div class="option-label-wrap">
                            <i class="fas fa-burst icon-dmg"></i>
                            <label for="opt-dmg">Dégâts des Ennemis</label>
                        </div>
                        <span id="opt-val-dmg" class="option-value-badge">1.0</span>
                    </div>
                    <input type="range" id="opt-dmg" class="option-slider" min="0.5" max="10.0" step="0.5" value="1.0" oninput="document.getElementById('opt-val-dmg').innerText = parseFloat(this.value).toFixed(1) + 'x'; UI.onSliderChange()">
                </div>

                <!-- Spawns -->
                <div class="option-row-card">
                    <div class="option-header">
                        <div class="option-label-wrap">
                            <i class="fas fa-skull-crossbones icon-spawn"></i>
                            <label for="opt-spawn">Vitesse de Réapparition</label>
                        </div>
                        <span id="opt-val-spawn" class="option-value-badge">1.0</span>
                    </div>
                    <input type="range" id="opt-spawn" class="option-slider" min="0.2" max="5.0" step="0.2" value="1.0" oninput="document.getElementById('opt-val-spawn').innerText = parseFloat(this.value).toFixed(1) + 'x'; UI.onSliderChange()">
                </div>

                <!-- Limite de Monstres -->
                <div class="option-row-card">
                    <div class="option-header">
                        <div class="option-label-wrap">
                            <i class="fas fa-ghost icon-maxmobs"></i>
                            <label for="opt-maxmobs">Limite de Monstres</label>
                        </div>
                        <span id="opt-val-maxmobs" class="option-value-badge">30</span>
                    </div>
                    <input type="range" id="opt-maxmobs" class="option-slider" min="5" max="100" step="5" value="30" oninput="document.getElementById('opt-val-maxmobs').innerText = parseInt(this.value); UI.onSliderChange()">
                </div>
            </div>

            <!-- TAB PLAYER -->
            <div id="tab-content-player" class="tab-content">
                <!-- PV Maximum du Joueur -->
                <div class="option-row-card">
                    <div class="option-header">
                        <div class="option-label-wrap">
                            <i class="fas fa-heart icon-php"></i>
                            <label for="opt-php">PV Max du Joueur</label>
                        </div>
                        <span id="opt-val-php" class="option-value-badge">1.0</span>
                    </div>
                    <input type="range" id="opt-php" class="option-slider" min="0.5" max="5.0" step="0.5" value="1.0" oninput="document.getElementById('opt-val-php').innerText = parseFloat(this.value).toFixed(1) + 'x'; UI.onSliderChange()">
                </div>

                <!-- Dégâts du Joueur -->
                <div class="option-row-card">
                    <div class="option-header">
                        <div class="option-label-wrap">
                            <i class="fas fa-wand-magic-sparkles icon-pdmg"></i>
                            <label for="opt-pdmg">Dégâts du Joueur</label>
                        </div>
                        <span id="opt-val-pdmg" class="option-value-badge">1.0</span>
                    </div>
                    <input type="range" id="opt-pdmg" class="option-slider" min="0.5" max="5.0" step="0.5" value="1.0" oninput="document.getElementById('opt-val-pdmg').innerText = parseFloat(this.value).toFixed(1) + 'x'; UI.onSliderChange()">
                </div>

                <!-- Niveau de départ -->
                <div class="option-row-card">
                    <div class="option-header">
                        <div class="option-label-wrap">
                            <i class="fas fa-arrow-up-right-dots icon-lvl"></i>
                            <label for="opt-lvl">Niveau de départ</label>
                        </div>
                        <span id="opt-val-lvl" class="option-value-badge">1</span>
                    </div>
                    <input type="range" id="opt-lvl" class="option-slider" min="1" max="50" step="1" value="1" oninput="document.getElementById('opt-val-lvl').innerText = parseInt(this.value); UI.onSliderChange()">
                </div>

                <!-- XP -->
                <div class="option-row-card">
                    <div class="option-header">
                        <div class="option-label-wrap">
                            <i class="fas fa-star icon-xp"></i>
                            <label for="opt-xp">Gain d'Expérience (XP)</label>
                        </div>
                        <span id="opt-val-xp" class="option-value-badge">1.0</span>
                    </div>
                    <input type="range" id="opt-xp" class="option-slider" min="0.5" max="10.0" step="0.5" value="1.0" oninput="document.getElementById('opt-val-xp').innerText = parseFloat(this.value).toFixed(1) + 'x'; UI.onSliderChange()">
                </div>
            </div>

            <!-- TAB LOOT -->
            <div id="tab-content-loot" class="tab-content">
                <!-- Chance Prismatiques -->
                <div class="option-row-card">
                    <div class="option-header">
                        <div class="option-label-wrap">
                            <i class="fas fa-gem icon-luck-prism"></i>
                            <label for="opt-luck-prism">Chance Prismatiques</label>
                        </div>
                        <span id="opt-val-luck-prism" class="option-value-badge">1.0</span>
                    </div>
                    <input type="range" id="opt-luck-prism" class="option-slider" min="0.5" max="10.0" step="0.5" value="1.0" oninput="document.getElementById('opt-val-luck-prism').innerText = parseFloat(this.value).toFixed(1) + 'x'; UI.onSliderChange()">
                </div>

                <!-- Chance Mini-Boss -->
                <div class="option-row-card">
                    <div class="option-header">
                        <div class="option-label-wrap">
                            <i class="fas fa-crown icon-luck-mini"></i>
                            <label for="opt-luck-mini">Chance Mini-Boss</label>
                        </div>
                        <span id="opt-val-luck-mini" class="option-value-badge">1.0</span>
                    </div>
                    <input type="range" id="opt-luck-mini" class="option-slider" min="0.0" max="10.0" step="0.5" value="1.0" oninput="document.getElementById('opt-val-luck-mini').innerText = parseFloat(this.value).toFixed(1) + 'x'; UI.onSliderChange()">
                </div>

                <!-- Activer les Événements Aléatoires -->
                <div class="option-row-card">
                    <div class="option-switch-wrap">
                        <div class="option-switch-label">
                            <i class="fas fa-bolt icon-events"></i>
                            <label for="opt-events">Événements Aléatoires</label>
                        </div>
                        <label class="custom-switch">
                            <input type="checkbox" id="opt-events" onchange="UI.onSliderChange()">
                            <span class="slider-switch"></span>
                        </label>
                    </div>
                </div>
            </div>
        </main>

        <footer style="margin-top: auto;">
            <button class="btn-main" style="width: 100%; margin: 0;" onclick="UI.saveOptionsAndReturn()">CONFIRMER & RETOUR</button>
        </footer>
    </div>
</div>
